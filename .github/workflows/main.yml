name: Build Medusa Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Samsung Galaxy J6+
    runs-on: ubuntu-22.04

    steps:
      - name: Download kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            zip

      - name: Set up Python 2.7
        uses: actions/setup-python@v5
        with:
          python-version: '2.7'

      - name: Configure Python 2 command
        shell: bash
        run: |
          python --version
          sudo ln -sf "$(command -v python)" /usr/local/bin/python2
          python2 --version

      - name: Check kernel toolchain
        run: |
          test -f arch/arm/configs/j6primelte_defconfig
          test -x gcc/bin/arm-linux-androideabi-gcc
          test -f build_medusa.sh

      - name: Compile kernel
        shell: bash
        run: |
          chmod +x build_medusa.sh
          ./build_medusa.sh

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medusa-J6Plus-Kernel
          path: out/arch/arm/boot/zImage
          if-no-files-found: error
          retention-days: 7
```
