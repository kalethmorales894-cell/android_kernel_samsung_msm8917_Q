
name: Diagnose Medusa Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Diagnose configuration and tools
        shell: bash
        run: |
          set +e
          echo "===== BRANCH AND COMMIT ====="
          git branch --show-current
          git rev-parse HEAD

          echo "===== J6+ DEFCONFIG FILE ====="
          test -f arch/arm/configs/j6primelte_defconfig
          echo "file test exit code: $?"

          echo "===== LOCALVERSION IN DEFCONFIG ====="
          grep -n 'CONFIG_LOCALVERSION' arch/arm/configs/j6primelte_defconfig
          echo "grep exit code: $?"

          echo "===== VERSION SETTINGS IN SOURCE ====="
          grep -nE 'CONFIG_LOCALVERSION|LOCALVERSION|KERNELVERSION' Makefile build_medusa.sh
          grep -n 'CONFIG_LOCALVERSION' arch/arm/configs/j6primelte_defconfig

          echo "===== BUILD SCRIPT SETTINGS ====="
          grep -nE '^(DEF=|export DEFCONFIG|export LOCALVERSION|BUILD_SUCCESS=|BUILD_END=)' build_medusa.sh

          echo "===== PYTHON AVAILABILITY ====="
          command -v python2
          command -v python2.7
          python3 --version

          echo "===== GCC VERSION ====="
          gcc/bin/arm-linux-androideabi-gcc --version

          echo "===== GCC STACK PROTECTOR SUPPORT ====="
          echo 'int main(void) { return 0; }' > /tmp/check.c
          gcc/bin/arm-linux-androideabi-gcc -fstack-protector-strong -c /tmp/check.c -o /tmp/check.o
          echo "stack protector test exit code: $?"

          echo "===== END DIAGNOSTIC ====="
