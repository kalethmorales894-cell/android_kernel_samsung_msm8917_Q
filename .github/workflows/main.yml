name: Build Medusa Kernel

on:
  workflow_dispatch:
    inputs:
      linker:
        description: "Enlazador para la prueba de diagnóstico"
        required: true
        default: gold
        type: choice
        options:
          - gold
          - bfd

permissions:
  contents: read

jobs:
  build:
    name: Compile Samsung Galaxy J6+
    runs-on: ubuntu-22.04

    steps:
      - name: Download kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            zip \
            wget \
            zlib1g-dev \
            libffi-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev

      - name: Install Python 2.7.18
        shell: bash
        run: |
          cd /tmp
          wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar -xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --prefix=/usr/local
          make -j2
          sudo make altinstall
          sudo ln -sf /usr/local/bin/python2.7 /usr/local/bin/python2
          python2 --version

      - name: Check kernel toolchain
        run: |
          test -f arch/arm/configs/j6primelte_defconfig
          test -x gcc/bin/arm-linux-androideabi-gcc
          test -f build_medusa.sh
          python2 --version

      - name: Compile kernel and save log
        env:
          MEDUSA_LD_CHOICE: ${{ inputs.linker || 'gold' }}
        shell: bash
        run: |
          chmod +x build_medusa.sh
          set +e
          ./build_medusa.sh 2>&1 | tee build_medusa.log
          BUILD_STATUS=${PIPESTATUS[0]}
          echo "BUILD_STATUS=$BUILD_STATUS" >> "$GITHUB_ENV"
          exit "$BUILD_STATUS"

      - name: Upload build log and available kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Medusa-J6Plus-Diagnostics
          path: |
            build_medusa.log
            out/arch/arm/boot/zImage-dtb
          if-no-files-found: warn
          retention-days: 7
